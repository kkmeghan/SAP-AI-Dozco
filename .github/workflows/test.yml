name: Test

# The site is published by GitHub Pages "Deploy from a branch" (repository root).
# This workflow only checks that the engine still runs end to end.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Engine smoke test
        run: node tools/smoke-test.js
